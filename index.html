<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zacky | Portfolio Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.3rem;
      font-size: 2.25rem;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }

    /* 2-Column Grid Setup */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      text-align: left;
    }

    @media (min-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr 1fr;
      }
    }

    .main-column-title {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 1.25rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #1e293b;
      font-weight: 700;
    }

    .links {
      display: grid;
      gap: 0.75rem;
    }

    .links a {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1rem 1.25rem;
      min-height: 72px; /* Ensures identical button heights across both sides */
      border-radius: 8px;
      background: #1e293b;
      color: #e5e7eb;
      text-decoration: none;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .links a:hover {
      background: #334155;
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    /* Eyebrow badge inside the right-column buttons */
    .badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Zacky</h1>
    <p class="subtitle">Multimedia Designer · Artist</p>

    <div class="grid-container">
      
      <!-- LEFT COLUMN: UI/UX -->
      <div class="column">
        <h2 class="main-column-title">UI / UX Projects</h2>
        
        <div class="links">
          <a href="https://statfinance.co.za/" target="_blank" rel="noopener noreferrer">
            Web Design - StatGroup Platform
          </a>
          <a href="https://zackydesigns.github.io/UI-UX-Assessment/" target="_blank" rel="noopener noreferrer">
            UI/UX Case Study
          </a>
          <a href="https://zackydesigns.github.io/Kixi-Portfolio/" target="_blank" rel="noopener noreferrer">
            UI/UX Hybrid Design - Kixi Portfolio (Hybrid Design)
          </a>
        </div>
      </div>

      <!-- RIGHT COLUMN: Visual & Traditional Art -->
      <div class="column">
        <h2 class="main-column-title">Visual & Traditional Art</h2>

        <div class="links">
          <!-- Digital Art -->
          <a href="https://zackydesigns.github.io/Social-Media-Branding/" target="_blank" rel="noopener noreferrer">
            <span class="badge">Digital Art</span>
            Social Media Branding
          </a>

          <!-- Branding -->
          <a href="https://zackydesigns.github.io/KAPortfolio/" target="_blank" rel="noopener noreferrer">
            <span class="badge">Branding</span>
            Kase Artist Portfolio
          </a>

          <!-- Graphite Art -->
          <a href="https://zackydesigns.github.io/GraphiteArt/" target="_blank" rel="noopener noreferrer">
            <span class="badge">Graphite Art</span>
            Graphite Drawing Portfolio
          </a>
        </div>

      </div>

    </div>
  </div>
</body>
</html>
